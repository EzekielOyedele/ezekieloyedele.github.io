<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ezekiel Oyedele — Data Analyst</title>

<style>
  :root{
    --paper:#F7F5F0;
    --ink:#181F2A;
    --ink-soft:#4A5262;
    --teal:#2F7A73;
    --amber:#D98E3B;
    --grid:#DAD5C8;
    --card:#FFFFFF;
    --max:1080px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}

  /* faint grid backdrop */
  .grid-bg{
    position:fixed;inset:0;z-index:-1;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.35;
    mask-image:linear-gradient(to bottom, black, transparent 85%);
  }

  /* nav */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(247,245,240,.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--grid);
  }
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;max-width:var(--max);margin:0 auto;
  }
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;}
  .brand .cell{color:var(--teal);}
  .navlinks{display:flex;gap:28px;}
  .navlinks a{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;color:var(--ink-soft);
    display:flex;flex-direction:column;gap:1px;
    transition:color .2s;
  }
  .navlinks a .ref{color:var(--amber);font-size:10px;}
  .navlinks a:hover{color:var(--ink);}
  .navlinks{display:none;}
  @media(min-width:720px){.navlinks{display:flex;}}

  /* hero */
  .hero{
    padding:120px 0 100px;
    display:grid;gap:40px;
  }
  @media(min-width:860px){
    .hero{grid-template-columns:1.3fr 1fr;align-items:center;padding:150px 0 120px;}
  }
